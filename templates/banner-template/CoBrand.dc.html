<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap">
  <style>
    body { margin: 0; background: #000000; }
    a { color: #ffffff; } a:hover { color: #c9a961; }
  </style>
</helmet>
<div style="width: 800px; height: 1600px; background: {{background}}; overflow: hidden; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 64px; font-family: Montserrat, Verdana, sans-serif; color: #ffffff;">

  <img src="leaf-mark.png" alt="Leaf monogram watermark" style="position: absolute; left: 40px; top: 423px; width: 720px; height: 754px; opacity: 0.07; display: block;">

  <img src="academy-logo.png" alt="Dr Rusnak Academy" style="position: relative; width: 640px; height: 174px; object-fit: contain; display: block;">

  <div style="position: relative; font-size: 56px; font-weight: 300; line-height: 1; color: #ffffff;">+</div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; width: 600px; height: 200px; border: 2px dashed rgba(201, 169, 97, 0.7); color: {{accent}};">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
    <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 56px; font-weight: 500; letter-spacing: 0.2em; line-height: 1; white-space: nowrap; text-align: center;">YOUR LOGO</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"background":{"editor":"color","default":"#000000","options":["#000000","#1c1a17","#2b3a4a","#ffffff"],"section":"Brand"},"accent":{"editor":"color","default":"#c9a961","options":["#c9a961","#ffffff","#e7c6c0","#8fa3b8"],"section":"Brand"},"$preview":{"width":800,"height":1600}}'>
class Component extends DCLogic {
  renderVals() {
    return { background: this.props.background ?? '#000000', accent: this.props.accent ?? '#c9a961' };
  }
}
</script>
</body>
</html>
