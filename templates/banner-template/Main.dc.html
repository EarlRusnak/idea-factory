<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap">
  <style>
    body { margin: 0; background: #ffffff; }
    a { color: #111111; } a:hover { color: #555555; }
  </style>
</helmet>
<div style="width: 800px; height: 1600px; background: #ffffff; overflow: hidden; display: flex; flex-direction: column; align-items: center; font-family: Montserrat, Verdana, sans-serif; color: #111111;">

  <div style="width: 800px; height: 540px; flex-shrink: 0; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <img src="hero.jpg" alt="Hero photo" style="position: absolute; left: 0; top: 0; width: 800px; height: 540px; object-fit: cover; display: block;">
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; width: 560px; height: 180px; border: 2px dashed rgba(17, 17, 17, 0.45); color: #111111;">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
      <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 60px; font-weight: 600; letter-spacing: 0.18em; line-height: 1; white-space: nowrap; text-align: center;">YOUR LOGO</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 36px; padding: 40px 50px 0; box-sizing: border-box; width: 800px;">
    <div style="font-size: 52px; font-weight: 600; letter-spacing: 0.12em; line-height: 1.15; text-align: center; text-transform: uppercase; color: {{accent}};">Scar and stretch mark treatment</div>
    <div style="font-size: 30px; font-weight: 400; letter-spacing: 0.1em; line-height: 1.3; text-align: center; text-transform: uppercase; color: #555555;">The most advanced and results-driven method for restoring skin texture and tone</div>
  </div>

  <div style="display: flex; flex-direction: row; gap: 20px; padding: 0 20px; margin-top: 36px; width: 800px; box-sizing: border-box;">
    <img src="before.jpg" alt="Before photo" style="width: 370px; height: 392px; object-fit: cover; display: block;">
    <img src="after.jpg" alt="After photo" style="width: 370px; height: 392px; object-fit: cover; display: block;">
  </div>

  <div style="font-size: 28px; font-weight: 400; line-height: 1.35; text-align: center; padding: 0 60px; margin-top: 60px; color: #111111;">Suitable for every skin type. Proven to improve texture and tone.</div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#111111","options":["#111111","#2b3a4a","#5a4632","#7a2e3d"],"section":"Brand"},"$preview":{"width":800,"height":1600}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#111111' };
  }
}
</script>
</body>
</html>
